providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.15.9 --activate",
  "pnpm install --frozen-lockfile --config.minimumReleaseAge=0",
  "pnpm exec prisma generate",
]

[phases.build]
cmds = ["echo 'Railway: Socket.IO only, skip Next.js build'"]

[start]
cmd = "node socket-server.js"
